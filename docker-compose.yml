version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: technest_postgres
    environment:
      POSTGRES_USER: technest_user
      POSTGRES_PASSWORD: technest_password
      POSTGRES_DB: technest_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: technest_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mailpit:
    image: axllent/mailpit:latest
    container_name: technest_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  qdrant_data: